name: HR Mailer Automation

on:
  schedule:
    # Runs 10 times daily. (Offset by 13 mins + Python micro-delay for organic send times)
    # UTC hours: 2, 4, 6, 8, 10, 12, 14, 15, 17, 19
    - cron: '13 2,4,6,8,10,12,14,15,17,19 * * *'
  workflow_dispatch: 
    # Allows you to manually click a "Run" button in GitHub to test it

jobs:
  run-mailer:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Mailer Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SENDER_ACCOUNTS: ${{ secrets.SENDER_ACCOUNTS }}
        run: python main.py